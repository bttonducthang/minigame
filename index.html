<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trò chơi giáo dục tương tác Bảo tàng Tôn Đức Thắng</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;

  background-image:url("assets/bg1.png");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  display:flex;
  flex-direction:column;
  align-items:center;

  color:white;
  text-align:center;

  padding:20px 15px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0);
  z-index:-1;
}

/* Logo */
.logo{
  width:120px;
  margin-top:5px;
}

/* Title */
.title{
  margin-top:10px;
  font-size:clamp(28px,6vw,48px);
  color:#b0050d;

  text-shadow:
    0 0 5px white,
    0 0 10px rgba(255,255,255,.8);
}

.title .line1{
  font-family:'Playfair Display', serif;
}

.title .line2{
  font-family:'Great Vibes', cursive;

  font-size:clamp(32px,6vw,58px);

  letter-spacing:1px;

  white-space:nowrap; /* không xuống dòng */
}

/* ===== KHUNG CHÍNH ===== */
.game-panel{
  margin-top:25px;

  width:100%;
  max-width:980px;

  padding:25px 20px;

  border-radius:22px;

  background:#145da0;

  /* LED màu xanh cyan */
  border:3px solid #66ffff;

  box-shadow:
    0 0 12px #66ffff,
    0 0 22px rgba(102,255,255,.5),
    0 0 30px rgba(102,255,255,.25),
    0 0 20px rgba(0,0,0,.45);
}

@keyframes ledBorder{
  0%{
    background-position:0% 0%,0% 50%;
  }
  100%{
    background-position:0% 0%,300% 50%;
  }
}

/* Tiêu đề panel */
.panel-title{
  font-size:clamp(24px,5vw,34px);
  font-weight:bold;
  margin-bottom:25px;
  color:#ffeb3b;

  text-shadow:
    0 0 10px rgba(0,0,0,.5),
    0 0 12px rgba(255,235,59,.5);
}

/* ===== SLIDER ===== */

.slider-container{
  position:relative;
  width:100%;
  overflow:hidden;
  padding:20px 0;
} 

.game-grid{
  display:flex;
  gap:28px;
  transition:transform .5s ease;
  justify-content:center;
  align-items:center;
}

.game-item{
  cursor:pointer;
  transition:.45s;
  width:240px;

  opacity:.45;
  transform:scale(.82);
  filter:blur(1px);
}

/* Game đang focus */
.game-item.active{
  opacity:1;
  transform:scale(1.08);
  filter:none;
  z-index:5;
}

/* Hover */
.game-item:hover{
  transform:scale(1.12);
}

/* Click */
.game-item:active{
  transform:scale(.96);
}

/* Nút slider */
.slider-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);

  width:54px;
  height:54px;

  border:none;
  border-radius:50%;

  background:rgba(0,0,0,.45);

  color:white;
  font-size:28px;
  font-weight:bold;

  cursor:pointer;
  z-index:20;

  backdrop-filter:blur(5px);

  box-shadow:
    0 0 10px rgba(255,255,255,.35),
    0 0 20px rgba(102,255,255,.3);

  transition:.25s;
}

.slider-btn:hover{
  transform:translateY(-50%) scale(1.12);
  background:rgba(0,0,0,.7);
}

.slider-btn:active{
  transform:translateY(-50%) scale(.92);
}

.slider-btn.prev{
  left:0;
}

.slider-btn.next{
  right:0;
}

/* Khung LED ảnh */
.img-wrapper{
  position:relative;
  display:inline-block;

  padding:5px;
  border-radius:18px;

  background:linear-gradient(
    45deg,
    red,orange,yellow,
    green,cyan,blue,
    violet,red
  );

  background-size:400%;
  animation:ledBorderImg 10s linear infinite;

  box-shadow:
    0 0 15px rgba(255,255,255,.3),
    0 0 25px rgba(255,255,255,.15);
}

@keyframes ledBorderImg{
  0%{
    background-position:0% 50%;
  }
  100%{
    background-position:400% 50%;
  }
}

.img-wrapper img{
  width:100%;
  display:block;
  border-radius:14px;
}

/* Tên game */
.game-name{
  margin-top:12px;

  font-size:20px;
  font-weight:bold;

  color:white;

  text-shadow:
    0 0 8px rgba(0,0,0,.6);
}

/* Feedback button */
.feed-btn{
  position:fixed;
  top:12px;
  left:12px;

  width:62px;
  height:62px;

  border-radius:50%;
  overflow:hidden;

  border:1px solid rgba(255,255,255,.45);

  background:transparent;

  cursor:pointer;

  z-index:999;

  box-shadow:
    0 0 10px rgba(255,255,255,.8),
    0 0 18px rgba(255,255,255,.5);

  animation:pulseMenu 1.8s infinite;
}

.feed-btn img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.feed-btn:hover{
  transform:scale(1.08);
}

.feed-btn:active{
  transform:scale(.92);
}

@keyframes pulseMenu{
  0%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.08);
  }
  100%{
    transform:scale(1);
  }
}

/* MOBILE */
@media (max-width:768px){

  .logo{
    width:95px;
  }

  .game-panel{
    padding:18px 14px;
  }

  .game-grid{
    gap:22px;
  }

  .game-item{
    width:100%;
    max-width:260px;
  }

  .game-name{
    font-size:18px;
  }

  .feed-btn{
    width:58px;
    height:58px;
    top:10px;
    left:10px;
  }
  .title{
    font-size:clamp(24px,5vw,34px);
  }

  .title .line2{
    font-size:clamp(24px,7vw,42px);
    letter-spacing:.5px;
  }
  
  .slider-btn{
  width:46px;
  height:46px;
  font-size:24px;
}

.game-item{
  width:220px;
  }
}
</style>
</head>

<body>

<!-- Logo -->
<a href="https://baotangtonducthang.vn/">
  <img src="assets/logo.png" class="logo">
</a>

<!-- Title -->
<div class="title">
  <div class="line1">Trò chơi giáo dục tương tác</div>
  <div class="line2">Bảo tàng Tôn Đức Thắng</div>
</div>

<!-- Khung game -->
<div class="game-panel">

  <div class="panel-title">
    🎮 Chọn trò chơi
  </div>
  
//== Nút lướt ==//
<div class="game-grid"><div class="slider-container">

<button class="slider-btn prev" onclick="moveSlide(-1)">
  ❮
</button>
<div class="game-grid" id="gameGrid">

    <!-- GAME 0 -->
    <div class="game-item"
      onclick="window.location.href='game0.html'">

      <div class="img-wrapper">
        <img src="assets/minigame_0.png">
      </div>

      <div class="game-name">
        [Dấu ấn thời gian]
      </div>
    </div>

    <!-- GAME 1 -->
    <div class="game-item active"
      onclick="window.location.href='game1.html'">

      <div class="img-wrapper">
        <img src="assets/minigame_1.png">
      </div>

      <div class="game-name">
        [Vòng quay lịch sử]
      </div>
    </div>

    <!-- GAME 2 -->
    <div class="game-item"
      onclick="window.location.href='game2.html'">

      <div class="img-wrapper">
        <img src="assets/minigame_2.png">
      </div>

      <div class="game-name">
        [Tìm hình giống nhau]
      </div>
    </div>
  
</div>

<button class="slider-btn next" onclick="moveSlide(1)">
  ❯
</button>

</div>
  </div>
</div>

<!-- Feedback -->
<button class="feed-btn"
onclick="window.open('https://bttonducthang.github.io/feedback-baotangtonducthang/')">
  <img src="assets/feedback.png">
</button>

  
<script>

const grid = document.getElementById("gameGrid");
const items = document.querySelectorAll(".game-item");

let current = 1;

function updateSlider(){

  items.forEach(item=>{
    item.classList.remove("active");
  });

  items[current].classList.add("active");

  const offset =
    (items[current].offsetLeft +
    items[current].clientWidth/2) -
    (grid.clientWidth/2);

  grid.style.transform = `translateX(${-offset}px)`;
}

function moveSlide(dir){

  current += dir;

  if(current < 0){
    current = items.length - 1;
  }

  if(current >= items.length){
    current = 0;
  }

  updateSlider();
}

window.addEventListener("load",()=>{
  updateSlider();
});

window.addEventListener("resize",()=>{
  updateSlider();
});

</script>
</body>
</html>
