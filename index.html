<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trò chơi giáo dục tương tác Bảo tàng Tôn Đức Thắng</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;

  background-image:url("assets/bg1.png");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  display:flex;
  flex-direction:column;
  align-items:center;

  color:white;
  text-align:center;

  padding:20px 15px;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0);
  z-index:-1;
}

/* Logo */
.logo{
  width:120px;
  margin-top:5px;
}

/* Title */
.title{
  margin-top:10px;
  font-size:clamp(28px,6vw,48px);
  color:#b0050d;

  text-shadow:
    0 0 5px white,
    0 0 10px rgba(255,255,255,.8);
}

.title .line1{
  font-family:'Playfair Display', serif;
}

.title .line2{
  font-family:'Great Vibes', cursive;

  font-size:clamp(32px,6vw,58px);

  letter-spacing:1px;

  white-space:nowrap; /* không xuống dòng */
}

/* ===== KHUNG CHÍNH ===== */
.game-panel{
  margin-top:25px;

  width:100%;
  max-width:980px;

  padding:25px 20px;

  border-radius:22px;

  background:#145da0;

  /* LED màu xanh cyan */
  border:3px solid #66ffff;

  box-shadow:
    0 0 12px #66ffff,
    0 0 22px rgba(102,255,255,.5),
    0 0 30px rgba(102,255,255,.25),
    0 0 20px rgba(0,0,0,.45);
}

/* Tiêu đề panel */
.panel-title{
  font-size:clamp(24px,5vw,34px);
  font-weight:bold;
  margin-bottom:15px;
  color:#ffeb3b;

  text-shadow:
    0 0 10px rgba(0,0,0,.5),
    0 0 12px rgba(255,235,59,.5);
}

/* CAROUSEL WRAPPER */
.carousel-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  margin-top: 10px;
}

.carousel-container {
  position: relative;
  width: 100%;
  height: 380px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  touch-action: pan-y;
  user-select: none;
}

/* Item Slider */
.game-item {
  position: absolute;
  width: 250px;
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, filter 0.4s ease;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  z-index: 1;
}

/* Trò chơi đang được chọn (Active) */
.game-item.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1.15);
  z-index: 10;
}

.game-item.active:hover {
  transform: translateX(0) scale(1.2);
}

.game-item.active:active {
  transform: translateX(0) scale(1.1);
}

/* Trò chơi bên trái */
.game-item.prev {
  opacity: 0.55;
  transform: translateX(-190px) scale(0.8);
  filter: blur(1px) grayscale(30%);
  z-index: 5;
}

/* Trò chơi bên phải */
.game-item.next {
  opacity: 0.55;
  transform: translateX(190px) scale(0.8);
  filter: blur(1px) grayscale(30%);
  z-index: 5;
}

/* Khung LED ảnh */
.img-wrapper{
  position:relative;
  display:inline-block;

  padding:5px;
  border-radius:18px;

  background:linear-gradient(
    45deg,
    red,orange,yellow,
    green,cyan,blue,
    violet,red
  );

  background-size:400%;
  animation:ledBorderImg 10s linear infinite;

  box-shadow:
    0 0 15px rgba(255,255,255,.3),
    0 0 25px rgba(255,255,255,.15);
}

@keyframes ledBorderImg{
  0%{
    background-position:0% 50%;
  }
  100%{
    background-position:400% 50%;
  }
}

.img-wrapper img{
  width:100%;
  display:block;
  border-radius:14px;
}

/* Tên game */
.game-name{
  margin-top:12px;

  font-size:20px;
  font-weight:bold;

  color:white;

  text-shadow:
    0 0 8px rgba(0,0,0,.6);
}

/* Nút Mũi Tên Navigation */
.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(20, 93, 160, 0.85);
  border: 2px solid #66ffff;
  color: #ffeb3b;
  font-size: 28px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
  box-shadow: 0 0 10px #66ffff;
}

.nav-arrow:hover {
  background: #66ffff;
  color: #145da0;
  transform: translateY(-50%) scale(1.15);
  box-shadow: 0 0 15px #66ffff;
}

.nav-arrow:active {
  transform: translateY(-50%) scale(0.95);
}

.nav-arrow.left {
  left: 5px;
}

.nav-arrow.right {
  right: 5px;
}

/* Feedback button */
.feed-btn{
  position:fixed;
  top:12px;
  left:12px;

  width:62px;
  height:62px;

  border-radius:50%;
  overflow:hidden;

  border:1px solid rgba(255,255,255,.45);

  background:transparent;

  cursor:pointer;

  z-index:999;

  box-shadow:
    0 0 10px rgba(255,255,255,.8),
    0 0 18px rgba(255,255,255,.5);

  animation:pulseMenu 1.8s infinite;
}

.feed-btn img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.feed-btn:hover{
  transform:scale(1.08);
}

.feed-btn:active{
  transform:scale(.92);
}

@keyframes pulseMenu{
  0%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.08);
  }
  100%{
    transform:scale(1);
  }
}

/* MOBILE */
@media (max-width:768px){

  .logo{
    width:95px;
  }

  .game-panel{
    padding:18px 10px;
  }

  .carousel-container {
    height: 320px;
  }

  .game-item {
    width: 200px;
  }

  .game-item.prev {
    transform: translateX(-120px) scale(0.75);
  }

  .game-item.next {
    transform: translateX(120px) scale(0.75);
  }

  .game-name{
    font-size:16px;
  }

  .nav-arrow {
    width: 38px;
    height: 38px;
    font-size: 20px;
  }

  .feed-btn{
    width:58px;
    height:58px;
    top:10px;
    left:10px;
  }
  .title{
    font-size:clamp(24px,5vw,34px);
  }

  .title .line2{
    font-size:clamp(24px,7vw,42px);
    letter-spacing:.5px;
  }
}

/* ===== TỐI ƯU MÀN HÌNH KIOSK / MÀN HÌNH LỚN (>= 1200px) ===== */
@media (min-width: 1200px) {
  .game-panel {
    max-width: 1150px; /* Nới rộng khung chứa chính */
  }

  .carousel-container {
    height: 440px; /* Tăng chiều cao vùng chứa slider */
  }

  .game-item {
    width: 290px; /* Tăng kích thước khung game */
  }

  /* Điều chỉnh khoảng cách đẩy 2 item bên cạnh */
  .game-item.prev {
    transform: translateX(-240px) scale(0.8);
  }

  .game-item.next {
    transform: translateX(240px) scale(0.8);
  }

  .game-name {
    font-size: 24px; /* Phóng to chữ tên game */
  }

  .nav-arrow {
    width: 56px;
    height: 56px;
    font-size: 32px;
  }
}
</style>
</head>

<body>

<!-- Logo -->
<a href="https://baotangtonducthang.vn/">
  <img src="assets/logo.png" class="logo">
</a>

<!-- Title -->
<div class="title">
  <div class="line1">Trò chơi giáo dục tương tác</div>
  <div class="line2">Bảo tàng Tôn Đức Thắng</div>
</div>

<!-- Khung game -->
<div class="game-panel">

  <div class="panel-title">
    🎮 Chọn trò chơi
  </div>

  <div class="carousel-wrapper" id="carouselWrapper">
    <button class="nav-arrow left" id="prevBtn">&#10094;</button>

    <div class="carousel-container" id="carouselContainer">

      <!-- GAME 0 -->
      <div class="game-item" data-url="game0.html">
        <div class="img-wrapper">
          <img src="assets/minigame_0.png" alt="Game 0">
        </div>
        <div class="game-name">
          [Dấu ấn thời gian]
        </div>
      </div>

      <!-- GAME 1 -->
      <div class="game-item" data-url="game1.html">
        <div class="img-wrapper">
          <img src="assets/minigame_1.png" alt="Game 1">
        </div>
        <div class="game-name">
          [Vòng quay lịch sử]
        </div>
      </div>

      <!-- GAME 2 -->
      <div class="game-item" data-url="game2.html">
        <div class="img-wrapper">
          <img src="assets/minigame_2.png" alt="Game 2">
        </div>
        <div class="game-name">
          [Tìm hình giống nhau]
        </div>
      </div>
	  
	<!-- GAME 3 -->
      <div class="game-item" data-url="">
        <div class="img-wrapper">
          <img src="assets/minigame_3.png" alt="Game 3">
        </div>
        <div class="game-name">
          [Coming soon]
        </div>
      </div>
    </div>

    <button class="nav-arrow right" id="nextBtn">&#10095;</button>
  </div>

</div>

<!-- Feedback -->
<button class="feed-btn"
onclick="window.open('https://bttonducthang.github.io/feedback-baotangtonducthang/')">
  <img src="assets/feedback.png">
</button>

<script>
  const items = document.querySelectorAll('.game-item');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const container = document.getElementById('carouselContainer');
  const wrapper = document.getElementById('carouselWrapper');

  let currentIndex = 0;
  const totalItems = items.length;
  let autoPlayTimer = null;
  const AUTO_PLAY_INTERVAL = 10000; // 100000ms = 10 giây

  function updateCarousel() {
    items.forEach((item, index) => {
      item.classList.remove('active', 'prev', 'next');
      item.onclick = null;

      if (index === currentIndex) {
        item.classList.add('active');
        item.onclick = () => {
          const url = item.getAttribute('data-url');
          if (url) window.location.href = url;
        };
      } else if (index === (currentIndex - 1 + totalItems) % totalItems) {
        item.classList.add('prev');
      } else if (index === (currentIndex + 1) % totalItems) {
        item.classList.add('next');
      }
    });
  }

  function nextSlide() {
    currentIndex = (currentIndex + 1) % totalItems;
    updateCarousel();
  }

  function prevSlide() {
    currentIndex = (currentIndex - 1 + totalItems) % totalItems;
    updateCarousel();
  }

  // Quản lý Tự động chạy (Auto-play)
  function startAutoPlay() {
    stopAutoPlay();
    autoPlayTimer = setInterval(nextSlide, AUTO_PLAY_INTERVAL);
  }

  function stopAutoPlay() {
    if (autoPlayTimer) {
      clearInterval(autoPlayTimer);
      autoPlayTimer = null;
    }
  }

  function resetAutoPlay() {
    startAutoPlay();
  }

  // Sự kiện nút điều khiển
  nextBtn.addEventListener('click', () => {
    nextSlide();
    resetAutoPlay();
  });

  prevBtn.addEventListener('click', () => {
    prevSlide();
    resetAutoPlay();
  });

  // Tạm dừng tự động chạy khi di chuột vào / Chạy lại khi rê chuột ra ngoài
  wrapper.addEventListener('mouseenter', stopAutoPlay);
  wrapper.addEventListener('mouseleave', startAutoPlay);

  // Xử lý Vuốt Chạm (Swipe) & Kéo Chuột (Drag)
  let startX = 0;
  let isDragging = false;

  container.addEventListener('touchstart', (e) => {
    stopAutoPlay();
    startX = e.touches[0].clientX;
  }, { passive: true });

  container.addEventListener('touchend', (e) => {
    let endX = e.changedTouches[0].clientX;
    handleSwipe(startX, endX);
    startAutoPlay();
  }, { passive: true });

  container.addEventListener('mousedown', (e) => {
    stopAutoPlay();
    isDragging = true;
    startX = e.clientX;
  });

  container.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    handleSwipe(startX, e.clientX);
    startAutoPlay();
  });

  container.addEventListener('mouseleave', () => {
    isDragging = false;
  });

  function handleSwipe(start, end) {
    const diff = start - end;
    if (Math.abs(diff) > 40) { // Ngưỡng vuốt tối thiểu 40px
      if (diff > 0) {
        nextSlide();
      } else {
        prevSlide();
      }
    }
  }

  // Khởi tạo trạng thái ban đầu và bắt đầu tự động cuộn
  updateCarousel();
  startAutoPlay();
</script>

</body>
</html>
